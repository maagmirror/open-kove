name: Build Open Kove APK

on:
  push:
    branches: [main, feat/kove-ble-buildnet]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes must not race to create the same release.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # versionName in app/build.gradle.kts decides the release. A push to main whose version
      # has no tag yet publishes release v<version>; otherwise it refreshes latest-build.
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v$version" ]; then
              echo "::warning::Tag $tag does not match versionName $version; the app will keep offering this release as an update."
            fi
            mode=release
          elif [ "${GITHUB_REF_NAME}" = "main" ] && ! gh release view "$tag" >/dev/null 2>&1; then
            mode=release
          else
            mode=latest
          fi
          if [ "$mode" = "release" ]; then
            apk="open-kove-$tag.apk"
          else
            apk="open-kove-$tag-$(git rev-parse --short HEAD).apk"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "Version $version → mode=$mode tag=$tag apk=$apk"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Android refuses to update an app signed with a different key, and each runner would
      # otherwise generate its own. Store a keystore in the DEBUG_KEYSTORE_BASE64 secret.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set; refusing to build an APK that cannot update earlier builds."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/github/release/app-github-release.apk "${{ steps.ver.outputs.apk }}"

      # Play bundle, only when the release key secrets exist. Never attached to the GitHub release.
      - name: Build Play bundle
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 not set; skipping the Play bundle."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew bundlePlayRelease --no-daemon
          cp app/build/outputs/bundle/playRelease/app-play-release.aab open-kove-play.aab
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: open-kove
          path: open-kove-*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: hashFiles('open-kove-play.aab') != ''
        with:
          name: open-kove-play-bundle
          path: open-kove-play.aab
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.ver.outputs.mode }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          APK: ${{ steps.ver.outputs.apk }}
        run: |
          if [ "$MODE" = "release" ]; then
            # Notes = the "## <version>" section of CHANGELOG.md, up to the next "## ".
            awk -v v="$VERSION" '
              $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "::warning::CHANGELOG.md has no '## $VERSION' section; using generated notes."
              echo "Open Kove $TAG." > notes.md
            fi
            printf '\n---\nCódigo fuente: este repositorio (AGPL-3.0).\n' >> notes.md
            if gh release view "$TAG" >/dev/null 2>&1; then
              # Release exists (e.g. tag pushed by hand after main built it): just refresh the APK.
              gh release upload "$TAG" "$APK" --clobber
            else
              # Tag the built commit ourselves so the release never points elsewhere.
              if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                git tag "$TAG" "$GITHUB_SHA"
                git push origin "refs/tags/$TAG"
              fi
              gh release create "$TAG" "$APK" --verify-tag \
                --title "Open Kove $TAG" --notes-file notes.md --latest
            fi
          else
            gh release delete latest-build --yes --cleanup-tag || true
            gh release create latest-build "$APK" --prerelease --target "$GITHUB_SHA" \
              --title "Open Kove (última compilación)" \
              --notes "Compilación automática de ${GITHUB_SHA} (versión $VERSION, todavía sin release propia). Para uso normal bajá la última versión, no esta. Código fuente: este repositorio (AGPL-3.0)."
          fi
