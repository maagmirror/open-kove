name: Build Open Kove APK

on:
  push:
    branches: [main, feat/kove-ble-buildnet]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Android refuses to update an app signed with a different key, and each runner would
      # otherwise generate its own. Store a keystore in the DEBUG_KEYSTORE_BASE64 secret.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set; refusing to build an APK that cannot update earlier builds."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          short=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "open-kove-$short.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: open-kove
          path: open-kove-*.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            gh release create "$tag" open-kove-*.apk --title "Open Kove $tag" --generate-notes
          else
            gh release delete latest-build --yes --cleanup-tag || true
            gh release create latest-build open-kove-*.apk --prerelease \
              --title "Open Kove (última compilación)" \
              --notes "Compilación automática de ${GITHUB_SHA}. Código fuente: este repositorio (AGPL-3.0)."
          fi
